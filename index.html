<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Trading</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070B14; --card:#0F1626; --line:#1E2A40; --orange:#FF8A1F; --orange2:#FFB347; --blue:#1E9BFF; --cyan:#3DE0FF; --green:#22D38A; --red:#FF5470; --text:#E8EEF8; --muted:#8A97AD; }
  html[data-theme=light] { --bg:#F5F7FB; --card:#FFFFFF; --line:#E1E7F0; --text:#0E1726; --muted:#5D6B82; }
  html[data-theme=light] nav { background:rgba(245,247,251,.8); }
  html[data-theme=light] .ticker, html[data-theme=light] .chart-card { background:#fff; }
  html[data-theme=light] .glow { opacity:.1; }
  body, nav, .stat, .trade, .step, .feat, .plan { transition:background .4s, color .4s, border-color .4s; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:'Cairo','Inter',sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }
  html[lang=en] body { font-family:'Inter','Cairo',sans-serif; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
  .glow { position:fixed; width:600px; height:600px; border-radius:50%; filter:blur(120px); opacity:.18; z-index:-1; animation:float 14s ease-in-out infinite; }
  @keyframes float { 50% { transform:translate(60px,-40px) scale(1.1); } }
  .grid-bg { position:fixed; inset:0; z-index:-2; background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:56px 56px; opacity:.25; mask-image:radial-gradient(circle at 50% 20%,#000,transparent 75%); }

  nav { position:sticky; top:0; z-index:10; backdrop-filter:blur(14px); background:rgba(7,11,20,.7); border-bottom:1px solid var(--line); }
  nav .wrap { display:flex; align-items:center; gap:24px; height:70px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:900; font-size:20px; }
  .brand img { width:42px; height:42px; border-radius:50%; }
  .brand span b { color:var(--orange); }
  .links { display:flex; gap:22px; margin-inline-start:auto; color:var(--muted); font-weight:600; }
  .links a:hover { color:var(--text); }
  .lang { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:7px 12px; font-weight:800; cursor:pointer; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:14px; font-weight:800; transition:.25s; cursor:pointer; border:0; font-size:16px; }
  .btn-main { background:linear-gradient(135deg,var(--orange),var(--orange2)); color:#1A0E00; box-shadow:0 10px 30px -10px var(--orange); }
  .btn-main:hover { transform:translateY(-3px); box-shadow:0 16px 40px -10px var(--orange); }
  .btn-ghost { border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--text); }
  .btn-ghost:hover { border-color:var(--blue); }

  .ticker { border-bottom:1px solid var(--line); background:#0A1020; overflow:hidden; white-space:nowrap; direction:ltr; }
  .ticker div { display:inline-block; padding:10px 0; animation:scroll 40s linear infinite; font-family:Inter; font-weight:600; font-size:14px; }
  .ticker span { margin:0 26px; color:var(--muted); }
  .ticker .up { color:var(--green); } .ticker .dn { color:var(--red); }
  @keyframes scroll { to { transform:translateX(-50%); } }

  .hero { padding:80px 0 60px; display:grid; grid-template-columns:1.1fr .9fr; gap:50px; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:99px; background:rgba(34,211,138,.1); color:var(--green); font-weight:700; font-size:14px; border:1px solid rgba(34,211,138,.3); }
  .pill i { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 8px rgba(34,211,138,0); } 0% { box-shadow:0 0 0 0 rgba(34,211,138,.6); } }
  h1 { font-size:clamp(38px,5.6vw,68px); line-height:1.15; font-weight:900; margin:20px 0; }
  h1 em { font-style:normal; background:linear-gradient(90deg,var(--orange),var(--orange2),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; background-size:200%; animation:shine 6s linear infinite; }
  @keyframes shine { to { background-position:200% 0; } }
  .lead { color:var(--muted); font-size:19px; line-height:1.8; max-width:560px; }
  .cta { display:flex; gap:14px; margin-top:32px; flex-wrap:wrap; }

  .chart-card { position:relative; background:linear-gradient(160deg,#111a2e,#0B1120); border:1px solid var(--line); border-radius:26px; padding:24px; box-shadow:0 30px 80px -30px rgba(30,155,255,.35); direction:ltr; }
  .chart-card .top { display:flex; justify-content:space-between; align-items:center; font-family:Inter; }
  .chart-card .pair { font-weight:800; font-size:18px; } .chart-card .pair small { color:var(--muted); font-weight:600; }
  .chart-card .price { font-weight:900; font-size:26px; color:var(--green); }
  svg.chart { width:100%; height:240px; margin-top:12px; }
  .line { stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw 3s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .float { position:absolute; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 16px; font-family:Inter; font-weight:800; animation:bob 4s ease-in-out infinite; }
  .float small { display:block; color:var(--muted); font-weight:600; font-size:12px; }
  @keyframes bob { 50% { transform:translateY(-12px); } }

  section { padding:70px 0; }
  .h2 { font-size:clamp(28px,3.6vw,42px); font-weight:900; text-align:center; }
  .sub { color:var(--muted); text-align:center; margin:12px auto 44px; max-width:620px; font-size:17px; line-height:1.7; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px; text-align:center; transition:.3s; }
  .stat:hover { transform:translateY(-6px); border-color:var(--orange); }
  .stat b { display:block; font-family:Inter; font-size:42px; font-weight:900; background:linear-gradient(135deg,var(--orange),var(--orange2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat span { color:var(--muted); font-weight:600; }

  .trades { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .trade { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px; direction:ltr; font-family:Inter; }
  .trade .row { display:flex; justify-content:space-between; align-items:center; }
  .trade .sym { font-weight:900; font-size:20px; }
  .tag { font-size:12px; font-weight:800; padding:4px 10px; border-radius:8px; }
  .buy { background:rgba(34,211,138,.12); color:var(--green); } .sell { background:rgba(255,84,112,.12); color:var(--red); }
  .trade .pnl { font-size:30px; font-weight:900; color:var(--green); margin:14px 0 6px; }
  .trade .meta { color:var(--muted); font-size:13px; display:flex; justify-content:space-between; }
  .bar { height:6px; border-radius:6px; background:var(--line); margin-top:14px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--cyan)); }

  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; counter-reset:s; }
  .step { position:relative; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:30px; }
  .step::before { counter-increment:s; content:counter(s); position:absolute; top:-18px; inset-inline-start:24px; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg,var(--orange),var(--orange2)); color:#1A0E00; font-weight:900; font-family:Inter; }
  .step h3 { margin:10px 0 8px; font-size:21px; } .step p { color:var(--muted); line-height:1.7; }

  .feats { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .feat { padding:26px; border-radius:22px; background:linear-gradient(160deg,rgba(30,155,255,.08),transparent); border:1px solid var(--line); }
  .feat .ic { font-size:30px; } .feat h3 { margin:12px 0 6px; } .feat p { color:var(--muted); line-height:1.6; font-size:15px; }

  .final { text-align:center; background:radial-gradient(circle at 50% 0%,rgba(255,138,31,.25),transparent 60%),var(--card); border:1px solid var(--line); border-radius:30px; padding:60px 24px; }
  .plans { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:stretch; }
  .plan { background:var(--card); border:1px solid var(--line); border-radius:26px; padding:32px; display:flex; flex-direction:column; }
  .plan.best { border:2px solid var(--orange); transform:scale(1.04); position:relative; }
  .plan.best::before { content:attr(data-badge); position:absolute; top:-14px; inset-inline-start:50%; transform:translateX(50%); background:linear-gradient(135deg,var(--orange),var(--orange2)); color:#1A0E00; font-weight:900; font-size:13px; padding:4px 14px; border-radius:99px; }
  html[dir=ltr] .plan.best::before { transform:translateX(-50%); }
  .plan h3 { font-size:22px; } .plan .pr { font-family:Inter; font-size:46px; font-weight:900; margin:14px 0 4px; } .plan .pr small { font-size:16px; color:var(--muted); font-weight:600; }
  .plan ul { list-style:none; margin:18px 0 26px; color:var(--muted); line-height:2.1; } .plan li::before { content:'✓  '; color:var(--green); font-weight:900; }
  .plan .btn { margin-top:auto; justify-content:center; }
  .pay { display:grid; grid-template-columns:auto 1fr; gap:36px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:28px; padding:34px; }
  .pay img { width:210px; height:210px; border-radius:18px; border:1px solid var(--line); background:#fff; padding:8px; }
  .addr { font-family:Inter; direction:ltr; background:var(--bg); border:1px dashed var(--line); border-radius:12px; padding:12px 14px; margin:14px 0; word-break:break-all; font-weight:700; }
  .net { display:inline-block; background:rgba(34,211,138,.12); color:var(--green); font-weight:800; padding:4px 12px; border-radius:8px; font-family:Inter; }
  footer { border-top:1px solid var(--line); padding:30px 0 40px; color:var(--muted); font-size:13px; line-height:1.8; text-align:center; }
  .demo { display:inline-block; font-size:12px; color:var(--orange2); border:1px dashed var(--orange); border-radius:8px; padding:2px 8px; margin-top:14px; }

  .reveal { opacity:0; transform:translateY(30px); transition:1s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity:1; transform:none; }
  @media (max-width:900px) { .plans,.pay { grid-template-columns:1fr; } .plan.best { transform:none; } .hero { grid-template-columns:1fr; padding-top:40px; } .links { display:none; } .stats,.feats { grid-template-columns:1fr 1fr; } .trades,.steps { grid-template-columns:1fr; } .float { display:none; } }
</style>
</head>

  lang = l; const i = l === 'ar' ? 0 : 1;

function setTheme(t) {
  const el = document.documentElement; t = t || (el.dataset.theme === 'light' ? 'dark' : 'light');

const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; e.target.classList.add('in');
  e.target.querySelectorAll('[data-count]').forEach(c => { const n = +c.dataset.count, t0 = performance.now();
    const step = now => { const p = Math.min((now - t0) / 1800, 1); c.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString('en') + c.dataset.suffix; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); });
  io.unobserve(e.target); }), { threshold: .15 });
document.querySelectorAll('.reveal').forEach(e => io.observe(e));
